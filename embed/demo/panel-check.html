<!doctype html><html><head><meta charset="utf-8"><title>panelcheck</title>
<style>html,body{margin:0;background:#0a0b0c;color:#8a949c;font:11px monospace}
#box{width:400px;height:520px}#log{padding:6px;white-space:pre}</style></head>
<body><div id="box"></div><div id="log">start</div>
<script type="module">
import { mount } from '../dist/model3d-viewer.mjs';
const log = (s) => { document.getElementById('log').textContent += '\n' + s; };
window.addEventListener('error', (e) => { document.title = 'ERR ' + e.message; });
window.addEventListener('unhandledrejection', (e) => { document.title = 'REJ ' + (e.reason?.message ?? e.reason); });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// Four things that were broken in the panel and looked, at a glance, like a
// deliberate minimal design. Each is asserted here because none of them threw.
//   1. the tracing buttons had no icon -- `icon()` returned null for a missing
//      path, and a button with no glyph is an invisible button;
//   2. the slider value labels were empty, because applySettings returned early
//      when nothing was stored and skipped the sync;
//   3. the sliders edited defaults instead of the scene, because the panel's copy
//      of the filament materials was never filled from the viewer;
//   4. the reset button was permanently disabled, because the loading flag was
//      set and never cleared.
const failures = [];
const check = (ok, what) => { log((ok ? 'ok   ' : 'FAIL ') + what); if (!ok) failures.push(what); };

const panel = mount(document.getElementById('box'), {
  source: './fixtures/large.gcode', language: 'ru', remember: false, showName: true,
  onStatus: async (s) => {
    if (s.kind !== 'ready') { if (s.kind === 'failed') document.title = 'FAIL ' + (s.message ?? ''); return; }
    await sleep(400);

    // 1. every visible button carries a glyph
    const buttons = [...document.querySelectorAll('.m3d-toolbar .m3d-btn')];
    const bare = buttons.filter((b) => b.querySelector('svg') === null);
    check(buttons.length >= 7, buttons.length + ' toolbar buttons');
    check(bare.length === 0, bare.length === 0 ? 'every button has an icon'
      : 'buttons without an icon: ' + bare.map((b) => b.title).join(', '));

    // 2. material mode offers the filament's sliders, each with a value. They are
    //    seated in the colour popover now rather than in a strip above the canvas,
    //    so they are counted once it is open -- and the count is four across the
    //    whole popover: transparency with the colour, matte, metalness and light
    //    in the block below.
    panel.togglePlainLighting();
    await sleep(250);
    check(panel.state.plainLighting === false, 'material mode is on');
    // The strip that used to hold them is gone from the panel entirely.
    check(document.querySelector('.m3d-surface-row') === null,
      'the old surface strip is gone from above the canvas');
    panel.openPicker(0);
    await sleep(250);
    const sliders = [...document.querySelectorAll('.m3d-picker-window .m3d-slider')];
    check(sliders.length === 4, 'four sliders in the window (transparency, matte, metalness, light), got ' + sliders.length);
    // A value is either text or, for the typeable percentage, an input.
    const blank = sliders.filter((s) => {
      const value = s.querySelector('.m3d-slider-value');
      if (value === null) return true;
      return value.tagName === 'INPUT' ? value.value === '' : value.textContent === '';
    });
    check(blank.length === 0, blank.length === 0 ? 'every slider shows its value'
      : 'sliders with no value: ' + blank.length);
    panel.picker.close(true);
    await sleep(150);

    // 3. the panel knows the scene's materials, not an empty array
    check(Array.isArray(panel.state.surfaces) && panel.state.surfaces.length > 0,
      'panel state carries ' + (panel.state.surfaces?.length ?? 0) + ' filament surface(s)');
    // The matte slider is the first in the material block; the block is the one
    // that was hidden above the canvas and is now inside the popover.
    const matte = [...panel.surfaceRow.querySelectorAll('.m3d-slider')][0];
    const shown = Number(matte?.querySelector('.m3d-slider-value')?.textContent);
    const actual = Math.round((panel.state.surfaces[0]?.matte ?? 0) * 100);
    check(shown === actual, 'matte slider shows ' + shown + ', scene says ' + actual);

    // 4. the reset button is usable once the file is ready
    check(panel.resetButton.disabled === false, 'reset button is enabled after loading');
    check(panel.loading === false, 'loading flag cleared');

    // 5. at this width nothing in the popover is clipped off its edge
    panel.openPicker(0);
    await sleep(250);
    const win = document.querySelector('.m3d-picker-window').getBoundingClientRect();
    const clipped = [...document.querySelectorAll('.m3d-picker-window .m3d-slider')]
      .filter((s) => s.getBoundingClientRect().right > win.right + 1);
    check(clipped.length === 0, clipped.length === 0 ? 'no slider is clipped off the window'
      : clipped.length + ' slider(s) past the right edge');
    panel.picker.close(true);
    await sleep(150);

    document.title = failures.length === 0 ? 'PANELCHECK ok' : 'FAIL ' + failures.join('; ');
  },
});
</script></body></html>
