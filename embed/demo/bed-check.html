<!doctype html><html><head><meta charset="utf-8"><title>bedcheck</title>
<style>html,body{margin:0;background:#0a0b0c;color:#8a949c;font:11px monospace}
#box{width:420px;height:340px}#log{padding:6px;white-space:pre}</style></head>
<body><div id="box"></div><div id="log">start</div>
<script type="module">
import { mount } from '../dist/model3d-viewer.mjs';
const log = (s) => { document.getElementById('log').textContent += '\n' + s; };
window.addEventListener('error', (e) => { document.title = 'ERR ' + e.message; });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// The grid used to be a fixed cyan, which read as "the most colourful thing on
// screen" on a white backdrop. It is now derived from the background: neutral in
// hue, and its luminance chosen opposite to whatever is behind it. This asserts
// that, which is a property no screenshot comparison would state precisely.
//
// Measured on pixels: over a dark backdrop the lines must be lighter than the
// backdrop, over a light one darker. And in both cases the line's hue must stay
// neutral -- red, green and blue within a few units of each other.
const failures = [];
const check = (ok, what) => { log((ok ? 'ok   ' : 'FAIL ') + what); if (!ok) failures.push(what); };

const p = mount(document.getElementById('box'), {
  source: './fixtures/sliced.3mf', language: 'ru', remember: false, view: 'sliced',
  onStatus: async (s) => {
    if (s.kind !== 'ready') { if (s.kind === 'failed') document.title = 'FAIL ' + (s.message ?? ''); return; }
    await sleep(600);
    p.toggleBed();
    p.viewer.setOrbit(0.95, 0.62);
    p.viewer.setZoom(1.6);
    await sleep(400);

    const canvas = document.querySelector('canvas');

    /** The brightest grid pixel and its colour, over one backdrop. */
    const sample = async (hex) => {
      p.setBackground(hex);
      await sleep(350);
      p.viewer.redraw();
      await sleep(250);
      const c = document.createElement('canvas');
      c.width = canvas.width; c.height = canvas.height;
      const g = c.getContext('2d');
      g.drawImage(canvas, 0, 0);
      const d = g.getImageData(0, 0, c.width, c.height).data;
      const backdrop = [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
      let best = null;
      // Only the band along the bottom of the canvas is sampled: the print sits in
      // the middle, and picking the pixel furthest from the backdrop anywhere in
      // the frame finds the blue filament, not the grid. This band is bed only.
      const y0 = Math.floor(c.height * 0.72);
      for (let y = y0; y < c.height; y += 1) {
        for (let x = 0; x < c.width; x += 1) {
          const i = (y * c.width + x) * 4;
          if (d[i+3] < 200) continue;
          const rgb = [d[i], d[i+1], d[i+2]];
          // Distance from the backdrop: this is a grid pixel, not plain background.
          const away = Math.abs(rgb[0]-backdrop[0]) + Math.abs(rgb[1]-backdrop[1]) + Math.abs(rgb[2]-backdrop[2]);
          if (away < 12) continue;
          const luma = 0.2126*rgb[0] + 0.7152*rgb[1] + 0.0722*rgb[2];
          if (best === null || away > best.away) best = { rgb, away, luma };
        }
      }
      const backdropLuma = 0.2126*backdrop[0] + 0.7152*backdrop[1] + 0.0722*backdrop[2];
      return { best, backdropLuma };
    };

    const dark = await sample('#1e2228');
    check(dark.best !== null, 'the grid draws at all on a dark backdrop');
    if (dark.best) {
      const spread = Math.max(...dark.best.rgb) - Math.min(...dark.best.rgb);
      check(dark.best.luma > dark.backdropLuma,
        'on dark the line is lighter: ' + dark.best.luma.toFixed(0) + ' against ' + dark.backdropLuma.toFixed(0));
      check(spread <= 12, 'on dark the line is neutral, channel spread ' + spread);
    }

    const light = await sample('#ffffff');
    check(light.best !== null, 'the grid draws at all on a white backdrop');
    if (light.best) {
      const spread = Math.max(...light.best.rgb) - Math.min(...light.best.rgb);
      check(light.best.luma < light.backdropLuma,
        'on white the line is darker: ' + light.best.luma.toFixed(0) + ' against ' + light.backdropLuma.toFixed(0));
      check(spread <= 12, 'on white the line is neutral, channel spread ' + spread);
    }

    document.title = failures.length === 0 ? 'BEDCHECK ok' : 'FAIL ' + failures.join('; ');
  },
});
</script></body></html>
