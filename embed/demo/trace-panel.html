<!doctype html><html><head><meta charset="utf-8"><title>tracepanel</title>
<style>body{margin:0;background:#0a0b0c;color:#8a949c;font:11px monospace}
#box{width:760px;height:560px}#log{padding:6px}</style></head>
<body><div id="box"></div><div id="log">start</div>
<script type="module">
import { mount } from '../dist/model3d-viewer.mjs';
const log = (s) => { document.getElementById('log').textContent += '\n' + s; };
window.addEventListener('error', (e) => { document.title = 'ERR ' + e.message; });
window.addEventListener('unhandledrejection', (e) => { document.title = 'REJ ' + (e.reason?.message ?? e.reason); });

const box = document.getElementById('box');
const panel = mount(box, {
  source: './fixtures/sliced.3mf', language: 'ru', remember: false,
  onStatus: (s) => {
    if (s.kind !== 'ready') { document.title = 'FAIL ' + (s.message ?? s.kind); return; }
    // A view from above so a cast shadow is visible.
    panel.viewer.setOrbit(0.9, 0.62);
    setTimeout(() => {
      panel.startTrace();
      log('tracing started');
      // Wait for the accumulation to pass a threshold, then report.
      let waited = 0;
      const poll = setInterval(() => {
        waited += 100;
        if (panel.state.traceSamples >= 60 || waited > 40000) {
          clearInterval(poll);
          const gl = panel.traceCanvas.getContext('webgl2');
          const px = new Uint8Array(760 * 560 * 4);
          gl.readPixels(0, 0, 760, 560, gl.RGBA, gl.UNSIGNED_BYTE, px);
          let lit = 0;
          for (let i = 0; i < px.length; i += 4) {
            if (0.2126*px[i] + 0.7152*px[i+1] + 0.0722*px[i+2] > 40) lit++;
          }
          log('samples=' + panel.state.traceSamples + ' lit=' + lit);
          log('button pressed=' + panel.traceButton.classList.contains('is-pressed'));
          document.title = 'TRACEPANEL s=' + panel.state.traceSamples + ' lit=' + lit;
        }
      }, 100);
    }, 300);
  },
});
globalThis.__panel = panel;
</script></body></html>
