<!doctype html><html><head><meta charset="utf-8"><title>pickercheck</title>
<style>html,body{margin:0;background:#0a0b0c;color:#8a949c;font:11px monospace}
#box{width:420px;height:460px}#log{padding:6px;white-space:pre}</style></head>
<body><div id="box"></div><div id="log">start</div>
<script type="module">
import { mount } from '../dist/model3d-viewer.mjs';
const log = (s) => { document.getElementById('log').textContent += '\n' + s; };
window.addEventListener('error', (e) => { document.title = 'ERR ' + e.message; });
window.addEventListener('unhandledrejection', (e) => { document.title = 'REJ ' + (e.reason?.message ?? e.reason); });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// The colour window replaced the browser's own. What is asserted here is what
// the native input could never promise: that the colour is previewed on the
// print while it is being chosen, that Cancel puts back *exactly* what was there
// including "no override at all", and that the window lives inside the panel
// rather than over the whole page.
const failures = [];
const check = (ok, what) => { log((ok ? 'ok   ' : 'FAIL ') + what); if (!ok) failures.push(what); };
const hexOf = (el) => {
  const c = getComputedStyle(el).backgroundColor.match(/\d+/g);
  return c === null ? '' : '#' + c.slice(0, 3).map((n) => Number(n).toString(16).padStart(2, '0')).join('');
};

const panel = mount(document.getElementById('box'), {
  source: './fixtures/sliced.3mf', language: 'ru', remember: false, view: 'sliced',
  onStatus: async (s) => {
    if (s.kind !== 'ready') { if (s.kind === 'failed') document.title = 'FAIL ' + (s.message ?? ''); return; }
    await sleep(500);

    // The material sliders are what a filament is edited with, so the swatches
    // are only selectable in material mode; plain shading has no highlight to
    // tune. Switching first is part of the setup, not a finding.
    panel.togglePlainLighting();
    await sleep(300);

    const swatches = [...document.querySelectorAll('.m3d-palette .m3d-swatch')];
    check(swatches.length >= 1, swatches.length + ' filament swatch(es)');
    // 1. No native colour input is left anywhere: that input is the thing that
    //    opened the operating system's sheet, and an invisible one still sitting
    //    on top of a swatch would take the click before the panel's own window.
    check(document.querySelectorAll('input[type="color"]').length === 0,
      'no native colour input is left in the panel');

    const original = panel.palette()[0];
    const swatch = swatches[0];
    const swatchBox = swatch.getBoundingClientRect();

    // 2. The window opens on a swatch click, from the DOM, as a user would.
    swatch.click();
    await sleep(150);
    const picker = document.querySelector('[data-model3d-picker]');
    check(picker !== null && picker.hidden === false, 'clicking a swatch opens the colour window');
    const square = document.querySelector('[data-picker-square]');
    const pickerBox = picker.getBoundingClientRect();
    const rootBox = panel.root.getBoundingClientRect();
    // A popover, not a screen: it covers a corner of the panel and leaves the
    // print visible. The old design dimmed the whole panel, which hid the one
    // thing the colour is being judged against.
    check(pickerBox.width < rootBox.width * 0.8 && pickerBox.height < rootBox.height,
      'the window is a popover, not a full-panel screen (' + Math.round(pickerBox.width) + 'x' + Math.round(pickerBox.height) + ' in ' + Math.round(rootBox.width) + 'x' + Math.round(rootBox.height) + ')');
    check(getComputedStyle(picker).backgroundColor === 'rgba(0, 0, 0, 0)',
      'nothing dims the scene behind it (' + getComputedStyle(picker).backgroundColor + ')');
    check(panel.root.contains(picker), 'the window is inside the panel root');
    check(swatchBox.width > 0, 'the swatch had a real box to click (' + swatchBox.width.toFixed(0) + 'px)');
    // Anchored to the swatch: its left edge is near the swatch, not centred.
    check(Math.abs(pickerBox.left - swatchBox.left) <= 12
      || pickerBox.right >= swatchBox.left && pickerBox.left <= swatchBox.right,
    'the popover opens out of the swatch that was clicked (swatch at ' + Math.round(swatchBox.left) + ', window at ' + Math.round(pickerBox.left) + ')');

    // Every frame is gone: no border on the popover, its fields or its buttons.
    const framed = [];
    for (const [label, node] of [
      ['window', document.querySelector('.m3d-picker-window')],
      ['hex row', document.querySelector('.m3d-picker-hex-row')],
      ['field', document.querySelector('.m3d-picker-field')],
      ['button', document.querySelector('.m3d-picker-button:not(.is-primary)')],
      ['preset', document.querySelector('.m3d-picker-preset')],
    ]) {
      const style = getComputedStyle(node);
      if (style.borderTopWidth !== '0px' || style.borderLeftWidth !== '0px') {
        framed.push(label + ' (top ' + style.borderTopWidth + ', left ' + style.borderLeftWidth + ')');
      }
    }
    check(framed.length === 0, framed.length === 0 ? 'no frames: the popover and its parts are borderless'
      : 'still framed: ' + framed.join(', '));

    // The material controls moved in here from a strip above the canvas.
    const surfaceBlock = document.querySelector('[data-picker-surface]');
    check(surfaceBlock !== null, 'the material controls are seated in the window');
    const surfaceSliders = [...(surfaceBlock?.querySelectorAll('.m3d-slider') ?? [])];
    check(surfaceSliders.length === 3, surfaceSliders.length + ' sliders in the material block (matte, metalness, light)');
    check(surfaceBlock !== null && panel.surfaceRow === surfaceBlock,
      'the panel\'s own slider row is the one in the window, not a copy');
    const clipped = surfaceSliders.filter((s) => s.getBoundingClientRect().right
      > document.querySelector('.m3d-picker-window').getBoundingClientRect().right + 1);
    check(clipped.length === 0, clipped.length + ' slider(s) past the popover edge');

    // Transparency sits with the colour, above the hex fields, because it is what
    // the colour does to the light behind it. Position is read from the DOM rather
    // than from the construction order: a block can be built in one order and laid
    // out in another, and it is the layout the user reads.
    const transparency = document.querySelector('[data-picker-transparency]');
    const hexRow = document.querySelector('.m3d-picker-hex-row');
    check(transparency !== null, 'the transparency control is in the window');
    check(transparency.getBoundingClientRect().top < hexRow.getBoundingClientRect().top,
      'transparency sits above the hex fields ('
        + Math.round(transparency.getBoundingClientRect().top) + ' vs ' + Math.round(hexRow.getBoundingClientRect().top) + ')');
    check(Math.abs(transparency.getBoundingClientRect().top - square.getBoundingClientRect().bottom) < 40,
      'and directly under the colour square, with the colour it fades');

    // No text label: the strip and the colour square above it are the label.
    check(transparency.querySelector('.m3d-slider-label') === null,
      'the transparency row carries no label');

    // The percentage is a field, not a readout: a slider is good for "a bit more"
    // and bad for "exactly forty", so the number is typeable.
    const percent = transparency.querySelector('.m3d-slider-value');
    check(percent !== null && percent.tagName === 'INPUT',
      'the percentage is a field (' + (percent?.tagName ?? 'absent') + ')');
    percent.value = '40';
    percent.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(120);
    check(Math.abs(panel.state.surfaces[0].transparency - 0.4) < 0.001,
      'typing 40 sets the scene to 0.40 (' + panel.state.surfaces[0].transparency + ')');
    check(Number(transparency.querySelector('input[type="range"]').value) === 0.4,
      'and the slider followed the typed number ('
        + transparency.querySelector('input[type="range"]').value + ')');
    // A typo must not be clamped into something plausible: it is reverted.
    percent.value = 'abc';
    percent.dispatchEvent(new Event('input', { bubbles: true }));
    percent.dispatchEvent(new Event('blur', { bubbles: true }));
    await sleep(80);
    check(Math.abs(panel.state.surfaces[0].transparency - 0.4) < 0.001,
      'unparseable text leaves the value alone (' + panel.state.surfaces[0].transparency + ')');

    // It is visualised: a strip carrying the filament's own colour fading out over
    // a checkerboard, not a bare line that only shows where the thumb is.
    const tone = transparency.querySelector('.m3d-slider-tone');
    check(tone !== null, 'the transparency slider is drawn, not just a line');
    const toneStyle = getComputedStyle(tone);
    const toneLayers = (toneStyle.backgroundImage.match(/gradient/g) ?? []).length;
    check(toneLayers >= 2, 'the strip layers the colour ramp over a checkerboard ('
      + toneLayers + ' gradient(s))');
    // The strip is the same kind of object as the hue bar -- a bar of colour you
    // drag along -- so it takes the hue bar's thickness and radius rather than
    // being sized on its own. Compared against the hue bar's measured box instead
    // of against "14px": the point is that the two agree, and a change to either
    // should bring them along together or fail here.
    // Thickness is the dimension *across* each bar, and they run on different
    // axes: the hue bar is vertical, so its thickness is its width, while the
    // transparency strip is horizontal and its thickness is its height. Comparing
    // height to height compared 14px to 145px -- the hue bar's length.
    const hueBar = document.querySelector('[data-picker-hue]');
    const hueThickness = Math.round(hueBar.getBoundingClientRect().width);
    const toneThickness = Math.round(tone.getBoundingClientRect().height);
    check(toneThickness === hueThickness,
      'the strip is the same thickness as the hue bar (' + toneThickness + ' across vs ' + hueThickness + ')');
    const hueRadius = getComputedStyle(hueBar).borderRadius;
    check(getComputedStyle(tone).borderRadius === hueRadius,
      'and the same rounding (' + getComputedStyle(tone).borderRadius + ' vs ' + hueRadius + ')');

    // The ramp has to be in the filament's colour, not a neutral grey: it belongs
    // to the slot being edited. Sampled from the declaration, since a 14-pixel
    // strip's pixels are unreliable at this size.
    const toneColour = (toneStyle.backgroundImage.match(/rgba?\(([^)]*)\)/) ?? [])[1] ?? '';
    const [tr, tg, tb] = toneColour.split(',').map((n) => Number(n));
    const filament = panel.palette()[0];
    const want = [1, 3, 5].map((at) => parseInt(filament.slice(at, at + 2), 16));
    check(tr === want[0] && tg === want[1] && tb === want[2],
      'the ramp is drawn in the filament\'s own colour (' + [tr, tg, tb].join(',') + ' against ' + want.join(',') + ' for ' + filament + ')');

    // 3. The square and the strip are boxes with gradients, not flat fills, and
    //    the cursors sit where the colour says they should.
    const hue = document.querySelector('[data-picker-hue]');
    check(square !== null && square.getBoundingClientRect().width >= 60,
      'the colour square is a real field (' + Math.round(square?.getBoundingClientRect().width ?? 0) + 'px)');
    // Two gradients over one flat colour: a black wash from the bottom for value,
    // a white wash from the left for saturation, and the hue itself underneath.
    // The hue layer is a solid colour, so counting gradients alone would say two.
    const layers = getComputedStyle(square).backgroundImage;
    const gradients = (layers.match(/linear-gradient/g) ?? []).length;
    check(gradients === 2 && layers.includes('rgb(') , 'the square is two washes over the hue ('
      + gradients + ' gradient(s), hue layer ' + (layers.includes('rgb(') ? 'present' : 'missing') + ')');

    // 4. Typing a hex colour previews it on the plate immediately, which is the
    //    whole reason for a window of our own rather than a system dialog.
    const field = document.querySelector('.m3d-picker-hex');
    field.value = '#ff0066';
    field.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(120);
    check(panel.viewer.paletteInfo()[0] === '#ff0066',
      'the plate previews the colour while the window is open (engine says ' + panel.viewer.paletteInfo()[0] + ')');
    check(hexOf(document.querySelectorAll('.m3d-palette .m3d-swatch')[0]) === '#ff0066',
      'the swatch previews it too (' + hexOf(document.querySelectorAll('.m3d-palette .m3d-swatch')[0]) + ')');
    // The HSV fields follow the hex rather than going stale.
    const numbers = [...document.querySelectorAll('.m3d-picker-field input')].map((i) => i.value);
    check(numbers[0] === '255' && numbers[1] === '0' && numbers[2] === '102',
      'the R, G and B fields agree with the hex (' + numbers.slice(0, 3).join(', ') + ')');
    // 336 is the hue of #ff0066: (0 - 102) / 255 * 60 + 360.
    check(numbers[3] === '336', 'H reads 336 for #ff0066 (' + numbers[3] + ')');

    // 4b. The transparency strip is drawn in the filament's colour, so it has to
    //     follow a preview too. It is repainted from `palette()`, which is rebuilt
    //     from the file's colours and the committed overrides on every call -- so a
    //     preview that lived only in a local copy of that array was invisible to it,
    //     and the strip kept the old colour while the plate and the swatch changed.
    //     Read off the declaration, since the strip fades and its pixels vary.
    const toneNow = () => {
      const layer = getComputedStyle(document.querySelector('.m3d-slider-tone')).backgroundImage;
      return (layer.match(/rgba?\(([^)]*)\)/) ?? [])[1] ?? '';
    };
    const previewedTone = toneNow().split(',').map((n) => Number(n));
    check(previewedTone[0] === 255 && previewedTone[1] === 0 && previewedTone[2] === 102,
      'the transparency strip follows the previewed colour (' + previewedTone.slice(0, 3).join(',') + ' for #ff0066)');

    // 5. Cancel puts back the colour that was there, and leaves no override: a
    //    "cancel" that left the new colour would be the worst possible outcome.
    document.querySelectorAll('.m3d-picker-button')[0].click();
    await sleep(150);
    check(picker.hidden === true, 'Cancel closes the window');
    check(panel.palette()[0] === original, 'Cancel restores the colour (' + panel.palette()[0] + ' vs ' + original + ')');
    check(panel.viewer.paletteInfo()[0] === original, 'the engine went back too (' + panel.viewer.paletteInfo()[0] + ')');
    check(Object.keys(panel.state.paletteOverrides).length === 0,
      'Cancel leaves no override behind, so the file\'s colour still rules');
    // And the strip goes back with it: a rejected colour must not survive in the
    // control that draws it.
    const restoredTone = toneNow().split(',').map((n) => Number(n));
    const wantRestored = [1, 3, 5].map((at) => parseInt(original.slice(at, at + 2), 16));
    check(restoredTone[0] === wantRestored[0] && restoredTone[1] === wantRestored[1] && restoredTone[2] === wantRestored[2],
      'Cancel puts the strip back to the original colour too (' + restoredTone.slice(0, 3).join(',') + ')');

    // 6. OK keeps it, and the value survives a repaint of the swatch row.
    panel.openPicker(0);
    await sleep(120);
    const field2 = document.querySelector('.m3d-picker-hex');
    field2.value = '#00ff88';
    field2.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(100);
    document.querySelectorAll('.m3d-picker-button')[1].click();
    await sleep(150);
    check(panel.palette()[0] === '#00ff88', 'OK keeps the colour (' + panel.palette()[0] + ')');
    check(panel.state.paletteOverrides[0] === '#00ff88', 'the colour is stored as an override of that slot');
    check(hexOf(document.querySelectorAll('.m3d-palette .m3d-swatch')[0]) === '#00ff88',
      'the swatch row shows the accepted colour');

    // 7. Escape dismisses, Enter accepts -- the two keys a window has to have.
    //    Driven on the window itself, because that is where the handler lives.
    panel.openPicker(0);
    await sleep(120);
    const win = document.querySelector('.m3d-picker-window');
    const f3 = document.querySelector('.m3d-picker-hex');
    f3.value = '#123456';
    f3.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(80);
    win.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await sleep(120);
    check(panel.palette()[0] === '#00ff88', 'Escape cancels (' + panel.palette()[0] + ')');

    panel.openPicker(0);
    await sleep(120);
    const f4 = document.querySelector('.m3d-picker-hex');
    f4.value = '#123456';
    f4.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(80);
    document.querySelector('.m3d-picker-window')
      .dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    await sleep(120);
    check(panel.palette()[0] === '#123456', 'Enter accepts (' + panel.palette()[0] + ')');

    // 8. A colour typed with no hue -- black -- must not lose the hue the window
    //    already had, or the square's cursor jumps to the corner and dragging up
    //    from black produces red instead of the colour being worked on.
    panel.openPicker(0);
    await sleep(120);
    const f5 = document.querySelector('.m3d-picker-hex');
    f5.value = '#202020';
    f5.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(80);
    const hueValue = Number([...document.querySelectorAll('.m3d-picker-field input')][3].value);
    check(hueValue === 210, 'a grey keeps the hue the window already had (' + hueValue + ')');
    document.querySelectorAll('.m3d-picker-button')[0].click();
    await sleep(100);

    // 9. A drag does not upload the palette once per pointer move. The camera drag
    //    had exactly this bug and the fix is the same: coalesce to one frame. Read
    //    as a count of uploads against a burst, because virtual time in this
    //    harness makes every clock in the page report zero.
    panel.openPicker(0);
    await sleep(150);
    const realSetPalette = panel.viewer.setPalette;
    let uploads = 0;
    panel.viewer.setPalette = (...args) => { uploads += 1; return realSetPalette(...args); };
    const fieldDrag = document.querySelector('.m3d-picker-hex');
    for (let step = 0; step < 40; step += 1) {
      fieldDrag.value = '#' + (0x101010 * step + 0x10203).toString(16).padStart(6, '0').slice(-6);
      fieldDrag.dispatchEvent(new Event('input', { bubbles: true }));
    }
    await sleep(200);
    panel.viewer.setPalette = realSetPalette;
    check(uploads > 0 && uploads < 40,
      '40 colour changes cause ' + uploads + ' palette upload(s), not one per move');
    document.querySelectorAll('.m3d-picker-button')[0].click();
    await sleep(120);

    // 10. The presets row offers the file's own palette, one button per filament.
    check(document.querySelectorAll('[data-picker-presets] .m3d-picker-preset').length === panel.palette().length,
      'the window offers the file\'s own palette to copy from');
    check(document.querySelectorAll('[data-picker-presets] button').length >= 1,
      'the presets are real buttons');

    document.title = failures.length === 0 ? 'PICKERCHECK ok' : 'FAIL ' + failures.join('; ');
  },
});
</script></body></html>
