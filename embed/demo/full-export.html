<!doctype html><html><head><meta charset="utf-8"><title>fullexport</title>
<style>body{margin:0;background:#0a0b0c}#box{width:900px;height:620px}</style></head>
<body><div id="box"></div><div id="log">start</div>
<script type="module">
import { mount } from '../dist/model3d-viewer.mjs';
const log = (s) => { document.getElementById('log').textContent += '\n' + s; };
window.addEventListener('error', (e) => { document.title = 'ERR ' + e.message; });

const host = document.createElement('div');
host.style.cssText = 'width:900px;height:620px';
document.getElementById('box').append(host);

const panel = mount(host, {
  source: './fixtures/large.gcode', language: 'ru', remember: false,
  onStatus: async (s) => {
    if (s.kind !== 'ready') { document.title = 'FAIL ' + (s.message ?? s.kind); return; }
    await new Promise((r) => setTimeout(r, 400));
    // The look the user had: studio material, mid level, the way a product shot
    // of this print would be set up.
    panel.togglePlainLighting();
    panel.toggleBed();
    panel.setBackground('#1c1d20');
    await new Promise((r) => setTimeout(r, 300));

    const url = panel.viewer.renderToImage({ width: 2048, background: panel.state.background ?? '#1c1d20' });
    const image = new Image();
    await new Promise((res) => { image.onload = res; image.src = url; });
    const canvas = document.createElement('canvas');
    canvas.width = image.width; canvas.height = image.height;
    canvas.style.cssText = 'width:900px;height:auto;display:block';
    canvas.getContext('2d').drawImage(image, 0, 0);
    document.getElementById('box').replaceChildren(canvas);
    log('exported ' + image.width + 'x' + image.height);
    document.title = 'FULLEXPORT ' + image.width + 'x' + image.height;
  },
});
</script></body></html>
