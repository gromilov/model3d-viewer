<!doctype html>
<html><head><meta charset="utf-8"><title>transparent control</title>
<style>html,body{margin:0;background:transparent}</style></head><body>
<!-- A circle drawn into a transparent canvas: proves the harness reports the
     non-transparent fraction correctly when Chrome writes an RGBA PNG instead of
     the opaque RGB one it emits for the reference page. -->
<canvas id="c" width="620" height="460" style="display:block"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
ctx.fillStyle = '#ffcc00';
ctx.beginPath(); ctx.arc(310, 230, 60, 0, Math.PI * 2); ctx.fill();
document.title = 'TRANSPARENT OK';
</script></body></html>
